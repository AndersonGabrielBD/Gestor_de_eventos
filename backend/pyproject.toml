[project]
name = "gestor-eventos-api"
version = "0.1.0"
description = "API do Sistema de Gestão de Eventos Institucionais"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.10",
    "cryptography>=43",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Dependências do worker de certificados (WeasyPrint precisa de Pango — use o Docker no Windows)
worker = [
    "weasyprint>=63",
    "pikepdf>=9",
    "qrcode[pil]>=8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # Depends() em argumentos default é o padrão do FastAPI
